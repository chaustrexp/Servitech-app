<!-- Plantilla de Inicio de Sesión de Usuarios -->
<!-- Formulario de Login en Django -->
<form method="POST" action="{% url 'login' %}" class="space-y-5">
  {% csrf_token %}
  <!-- ¡OBLIGATORIO EN DJANGO! -->

  <div>
    <label class="block text-xs font-semibold text-slate-700 mb-1"
      >Correo electrónico</label
    >
    <div class="relative">
      <input
        type="email"
        name="email"
        required
        placeholder="nombre@empresa.com"
        class="..."
      />
    </div>
  </div>

  <!-- resto de los campos... -->
</form>
