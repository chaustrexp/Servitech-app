{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServiTech - Contraseña Restablecida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #img-fondo {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            object-fit: cover; object-position: center; z-index: -2;
        }
        #img-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            background: rgba(0, 15, 50, 0.25); z-index: -1;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <img id="img-fondo" src="{% static 'img/Fondo/Fondo para login.jpeg' %}" alt="Fondo">
    <div id="img-overlay"></div>

    <div class="bg-white w-full max-w-md rounded-[24px] shadow-2xl p-8 text-center">

        <!-- Logo -->
        <div class="inline-flex items-center gap-3 mb-6">
            <img src="{% static 'img/Logo/logo.jpg' %}" alt="ServiTech" class="h-10 w-auto object-contain rounded-xl shadow">
            <span class="text-xl font-extrabold text-[#002b75]">ServiTech</span>
        </div>

        <!-- Ícono éxito -->
        <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-5">
            <svg class="w-9 h-9 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </div>

        <h1 class="text-xl font-bold text-slate-800 mb-2">¡Contraseña restablecida!</h1>
        <p class="text-sm text-slate-500 leading-relaxed mb-8">
            Tu contraseña ha sido actualizada correctamente. Ya puedes iniciar sesión con tu nueva contraseña.
        </p>

        <a href="{% url 'login' %}"
           class="block w-full text-center text-white font-bold py-3 rounded-xl text-sm shadow-md transition hover:-translate-y-0.5"
           style="background: linear-gradient(135deg, #002b75 0%, #0e3687 100%);">
            Ir al inicio de sesión
        </a>
    </div>
</body>
</html>
