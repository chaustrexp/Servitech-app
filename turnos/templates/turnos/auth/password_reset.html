{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServiTech - Recuperar Contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #img-fondo {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            object-fit: cover; object-position: center; z-index: -2;
        }
        #img-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            background: rgba(0, 15, 50, 0.25); z-index: -1;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #002b75 0%, #0e3687 100%);
            transition: all 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 43, 117, 0.35);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <img id="img-fondo" src="{% static 'img/Fondo/Fondo para login.jpeg' %}" alt="Fondo">
    <div id="img-overlay"></div>

    <div class="glass-card w-full max-w-md rounded-[24px] shadow-2xl p-8">

        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-3 mb-4">
                <img src="{% static 'img/Logo/logo.jpg' %}" alt="ServiTech" class="h-11 w-auto object-contain rounded-xl shadow">
                <span class="text-2xl font-extrabold text-[#002b75] tracking-tight">ServiTech</span>
            </div>
        </div>

        <!-- Icono -->
        <div class="w-16 h-16 rounded-2xl bg-[#eef2ff] flex items-center justify-center mx-auto mb-5">
            <svg class="w-8 h-8 text-[#002b75]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                      d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
            </svg>
        </div>

        <h1 class="text-xl font-bold text-slate-800 text-center mb-1">¿Olvidaste tu contraseña?</h1>
        <p class="text-sm text-slate-400 text-center mb-7 leading-relaxed">
            Ingresa tu correo y te enviaremos un enlace para restablecerla.
        </p>

        <!-- Mensajes de error -->
        {% if form.errors %}
        <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3 mb-5">
            {{ form.email.errors }}
        </div>
        {% endif %}

        <!-- Formulario -->
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wider">
                    Correo electrónico
                </label>
                <div class="relative">
                    <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"
                         fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                              d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/>
                    </svg>
                    <input type="email" name="email" autofocus required
                           placeholder="tucorreo@ejemplo.com"
                           class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#002b75] focus:ring-2 focus:ring-[#002b75]/10 transition">
                </div>
            </div>

            <button type="submit"
                    class="btn-primary w-full text-white font-bold py-3 rounded-xl text-sm shadow-md mt-2">
                Enviar enlace de recuperación
            </button>
        </form>

        <!-- Volver al login -->
        <div class="text-center mt-6">
            <a href="{% url 'login' %}" class="text-sm font-semibold text-[#002b75] hover:underline flex items-center justify-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Volver al inicio de sesión
            </a>
        </div>
    </div>
</body>
</html>
