<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiTech - Selecciona tu Dispositivo</title>
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#032B74',
                            900: '#001E50',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-800">

    <!-- NAVBAR -->
    <header class="bg-white border-b border-slate-200 py-4 px-8 flex justify-between items-center">
        <div class="text-2xl font-bold text-navy-900 tracking-tight">
            ServiTech
        </div>

        <nav class="hidden md:flex space-x-8 text-sm font-medium text-slate-600">
            <a href="#" class="hover:text-navy-900 transition-colors">Inicio</a>
            <a href="#" class="text-navy-900 border-b-2 border-navy-900 pb-1 font-semibold">Servicios</a>
            <a href="#" class="hover:text-navy-900 transition-colors">Nosotros</a>
            <a href="#" class="hover:text-navy-900 transition-colors">Contacto</a>
        </nav>

        <div>
            <button
                class="bg-navy-900 text-white text-sm font-medium px-5 py-2.5 rounded-lg hover:bg-navy-800 transition-colors">
                Mi Perfil
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">

        <!-- STEPPER (PASOS DE PROCESO) -->
        <div class="mb-10">
            <div class="relative flex items-center justify-between">
                <!-- Línea conectora de fondo -->
                <div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-0.5 bg-slate-200 -z-10"></div>

                <!-- Paso 1 (Activo) -->
                <div class="flex flex-col items-center">
                    <div
                        class="w-10 h-10 rounded-full bg-slate-100 border-2 border-navy-900 text-navy-900 font-bold flex items-center justify-center text-sm shadow-sm bg-white">
                        1
                    </div>
                    <span class="text-xs font-bold text-navy-900 mt-2">Dispositivo</span>
                </div>

                <!-- Paso 2 -->
                <div class="flex flex-col items-center">
                    <div
                        class="w-10 h-10 rounded-full bg-white border border-slate-300 text-slate-500 font-semibold flex items-center justify-center text-sm">
                        2
                    </div>
                    <span class="text-xs font-medium text-slate-500 mt-2">Servicio</span>
                </div>

                <!-- Paso 3 -->
                <div class="flex flex-col items-center">
                    <div
                        class="w-10 h-10 rounded-full bg-white border border-slate-300 text-slate-500 font-semibold flex items-center justify-center text-sm">
                        3
                    </div>
                    <span class="text-xs font-medium text-slate-500 mt-2">Fecha y Hora</span>
                </div>

                <!-- Paso 4 -->
                <div class="flex flex-col items-center">
                    <div
                        class="w-10 h-10 rounded-full bg-white border border-slate-300 text-slate-500 font-semibold flex items-center justify-center text-sm">
                        4
                    </div>
                    <span class="text-xs font-medium text-slate-500 mt-2">Resumen</span>
                </div>
            </div>
        </div>

        <!-- TARJETA CONTENEDORA -->
        <form method="POST" action="" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            {% csrf_token %}
            <input type="hidden" name="dispositivo" id="dispositivo_input" value="">

            <!-- Cuerpo de la Tarjeta -->
            <div class="p-8">
                <h2 class="text-2xl font-bold text-navy-900 mb-8">Selecciona tu dispositivo</h2>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                    <!-- Tarjeta CELULAR -->
                    <label
                        class="device-card cursor-pointer group relative border-2 border-slate-200 rounded-2xl p-8 flex flex-col items-center justify-center hover:border-navy-900 hover:shadow-md transition-all">
                        <input type="radio" name="dispositivo_radio" value="celular" class="sr-only"
                            onchange="seleccionarDispositivo('celular')">
                        <div
                            class="w-16 h-16 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 mb-4 group-hover:bg-navy-900 group-hover:text-white transition-colors">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z">
                                </path>
                            </svg>
                        </div>
                        <span class="font-bold tracking-wider text-slate-800 text-base uppercase">CELULAR</span>
                    </label>

                    <!-- Tarjeta LAPTOP -->
                    <label
                        class="device-card cursor-pointer group relative border-2 border-slate-200 rounded-2xl p-8 flex flex-col items-center justify-center hover:border-navy-900 hover:shadow-md transition-all">
                        <input type="radio" name="dispositivo_radio" value="laptop" class="sr-only"
                            onchange="seleccionarDispositivo('laptop')">
                        <div
                            class="w-16 h-16 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 mb-4 group-hover:bg-navy-900 group-hover:text-white transition-colors">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                </path>
                            </svg>
                        </div>
                        <span class="font-bold tracking-wider text-slate-800 text-base uppercase">LAPTOP</span>
                    </label>

                    <!-- Tarjeta PC -->
                    <label
                        class="device-card cursor-pointer group relative border-2 border-slate-200 rounded-2xl p-8 flex flex-col items-center justify-center hover:border-navy-900 hover:shadow-md transition-all">
                        <input type="radio" name="dispositivo_radio" value="pc" class="sr-only"
                            onchange="seleccionarDispositivo('pc')">
                        <div
                            class="w-16 h-16 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 mb-4 group-hover:bg-navy-900 group-hover:text-white transition-colors">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                </path>
                            </svg>
                        </div>
                        <span class="font-bold tracking-wider text-slate-800 text-base uppercase">PC</span>
                    </label>

                </div>
            </div>

            <!-- Pie de Tarjeta con Botón de Acción -->
            <div class="bg-indigo-50/50 border-t border-slate-200 p-6 flex justify-end">
                <button type="submit" id="btn-siguiente" disabled
                    class="bg-navy-900 opacity-50 cursor-not-allowed text-white font-semibold text-sm px-7 py-3 rounded-xl flex items-center gap-2 hover:bg-navy-800 transition-all">
                    <span>Siguiente</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </button>
            </div>
        </form>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-6 px-8 text-xs text-slate-500">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="font-bold text-navy-900 text-base">ServiTech</div>
            <div class="flex space-x-6">
                <a href="#" class="hover:underline">Privacidad</a>
                <a href="#" class="hover:underline">Términos</a>
                <a href="#" class="hover:underline">Soporte</a>
            </div>
            <div>© 2026 ServiTech. Todos los derechos reservados.</div>
        </div>
    </footer>

    <!-- INTERACTIVIDAD CON JAVASCRIPT -->
    <script>
        function seleccionarDispositivo(tipo) {
            document.getElementById('dispositivo_input').value = tipo;

            // Habilitar botón de siguiente
            const btn = document.getElementById('btn-siguiente');
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');

            // Resaltar tarjeta seleccionada
            document.querySelectorAll('.device-card').forEach(card => {
                card.classList.remove('border-navy-900', 'bg-indigo-50/20');
            });

            event.currentTarget.classList.add('border-navy-900', 'bg-indigo-50/20');
        }
    </script>
</body>

</html>
