<!-- Plantilla base del proyecto ServiTech (Navbar, Footer, Tailwind) -->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ServiTech{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 font-sans min-h-screen flex flex-col text-slate-800">

    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 py-4 px-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <!-- Logo -->
            <a href="{% url 'agendamiento' %}" class="text-2xl font-bold text-blue-900 tracking-tight">ServiTech</a>

            <!-- Navegación -->
            <nav class="hidden md:flex space-x-8 font-medium text-slate-600">
                <a href="#" class="hover:text-blue-900 transition">Inicio</a>
                <a href="{% url 'agendamiento' %}"
                    class="text-blue-900 font-semibold border-b-2 border-blue-900 pb-1">Servicios</a>
                <a href="#" class="hover:text-blue-900 transition">Nosotros</a>
                <a href="#" class="hover:text-blue-900 transition">Contacto</a>
            </nav>

            <!-- Botón Perfil -->
            <a href="#"
                class="bg-blue-900 hover:bg-blue-950 text-white font-medium px-5 py-2.5 rounded-lg shadow-sm transition">
                Mi Perfil
            </a>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow py-12 px-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 px-8 text-sm text-slate-500">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <span class="text-xl font-bold text-blue-900">ServiTech</span>

            <div class="flex space-x-6">
                <a href="#" class="underline hover:text-slate-800">Privacidad</a>
                <a href="#" class="underline hover:text-slate-800">Términos</a>
                <a href="#" class="underline hover:text-slate-800">Soporte</a>
            </div>

            <span>&copy; 2026 ServiTech. Todos los derechos reservados.</span>
        </div>
    </footer>

</body>

</html>
