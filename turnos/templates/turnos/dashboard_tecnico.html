{% extends 'turnos/base.html' %}

{% block title %}Panel del Técnico - ServiTech{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-10 text-center">
        <div class="w-16 h-16 rounded-full bg-blue-50 flex items-center justify-center text-blue-900 mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-blue-900 mb-2">Panel del Técnico</h1>
        <p class="text-slate-500">Bienvenido, <strong>{{ user.nombre_completo }}</strong>. Aquí verás tus citas asignadas y horarios.</p>
        <div class="mt-6 inline-block bg-amber-50 text-amber-800 border border-amber-200 text-sm px-4 py-2 rounded-lg">
            🚧 Esta sección está en desarrollo
        </div>
    </div>
</div>
{% endblock %}
